<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="自律動起來 - 開啟自律生活的第一步">
    <meta name="theme-color" content="#74c0fc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="自律動起來">
    
    <title>自律動起來</title>
    
    <!-- ═══════════════════════════════════════════════════════════
         Web App 圖示配置 - 讓用戶能將應用加入主畫面
         ═══════════════════════════════════════════════════════════ -->
    
    <!-- iOS Safari 應用圖示 (Apple Touch Icon) - 黃星藍底 ⭐ -->
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180x180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon-167x167.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon-152x152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="icon-120x120.png">
    
    <!-- 瀏覽器 Favicon -->
    <link rel="icon" type="image/png" sizes="96x96" href="icon-96x96.png">
    <link rel="icon" type="image/png" sizes="64x64" href="icon-64x64.png">
    <link rel="shortcut icon" href="icon-96x96.png">
    
    <!-- Web App Manifest (Android 主畫面安裝) -->
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        /* ── Design Tokens ──────────────────────────────── */
        :root {
            /* 色彩系統：主色 / 輔色 / 強調 */
            --c-primary:   #74c0fc;   /* 藍：主要動作、active 狀態 */
            --c-primary-bg: #e0f2fe;
            --c-primary-text: #0e4f7a;
            --c-accent:    #ffd43b;   /* 黃：練功、高亮行動 */
            --c-accent-bg: #fef9c3;
            --c-accent-text: #6b4f00;
            --c-danger:    #ff8787;   /* 紅：危險、清除 */
            --c-danger-bg: #fff0f0;
            --c-danger-text: #9b1c1c;
            --c-success:   #8ce99a;   /* 綠：成功、完成 */
            --c-muted:     #9ca3af;   /* 次要文字 */
            --c-border:    #e5e7eb;   /* 通用邊框 */
            --c-border-strong: #d1d5db;
            --c-surface:   #f8fafc;   /* 頁面背景 */
            --c-card:      #ffffff;
            --c-text:      #1f2937;
            --c-text-sub:  #6b7280;
            /* 圓角系統：3 個 token */
            --r-badge: 6px;
            --r-btn:   10px;
            --r-card:  16px;
            /* 間距基準 */
            --sp-page: 24px;
            --sp-card: 20px;
            --sp-gap:  16px;
        }

        @layer utilities {
            /* 邊框：僅用於 CTA 主按鈕保留 neo 風格 */
            .neo-border       { @apply border-2 border-[#374151]; }
            .neo-border-thin  { border: 1px solid var(--c-border-strong); }
            /* neo-shadow：僅用於主要 CTA */
            .neo-shadow       { box-shadow: 4px 4px 0px 0px #374151; }
            .neo-shadow-sm    { box-shadow: 2px 2px 0px 0px #374151; }
            /* 一般卡片陰影：柔和 */
            .card-shadow      { box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px var(--c-border); }
            /* 按壓動畫 */
            .active-press     { @apply active:translate-x-[1px] active:translate-y-[1px] active:shadow-none transition-all duration-100; }
            .overlay-blur     { backdrop-filter: blur(8px); background-color: rgba(31,41,55,0.45); }
            .sans-font        { font-family: 'Noto Sans TC', sans-serif; font-weight: 900; }
            .sans-normal      { font-family: 'Noto Sans TC', sans-serif; font-weight: 400; }
            .float-anim       { animation: float 3s ease-in-out infinite; }
            @keyframes float  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

            /* 統一色塊 — 主色 / 輔色 / 強調 */
            .pk-blue   { background-color: var(--c-primary); }
            .pk-yellow { background-color: var(--c-accent); }
            .pk-pink   { background-color: var(--c-danger); }
            .pk-green  { background-color: var(--c-success); }
            .pk-purple { background-color: #b197fc; }
            .pk-orange { background-color: #ff922b; }

            /* 邊框色塊 — 統一淺底 */
            .pk-border-blue   { border-color: var(--c-primary) !important; background-color: var(--c-primary-bg); }
            .pk-border-yellow { border-color: var(--c-accent) !important; background-color: var(--c-accent-bg); }
            .pk-border-pink   { border-color: var(--c-danger) !important; background-color: var(--c-danger-bg); }
            .pk-border-green  { border-color: var(--c-success) !important; background-color: #f0fdf4; }
            .pk-border-purple { border-color: #b197fc !important; background-color: #faf5ff; }
            .pk-border-orange { border-color: #ff922b !important; background-color: #fff7ed; }

            /* 主標題卡片：純白底，不用漸層 */
            .vibrant-card { background: var(--c-card); border: 1px solid var(--c-border); }

            /* 圓角 utilities — 對應 token */
            .r-badge { border-radius: var(--r-badge); }
            .r-btn   { border-radius: var(--r-btn); }
            .r-card  { border-radius: var(--r-card); }
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--c-surface);
            color: var(--c-text);
            -webkit-font-smoothing: antialiased;
        }

        /* 字體層級：語意化顏色，不用 opacity */
        .text-primary   { color: var(--c-text); }
        .text-secondary { color: var(--c-text-sub); }
        .text-muted     { color: var(--c-muted); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const firebaseConfig = {
            apiKey: "AIzaSyAdCP5BvvIhcjYt2_Re80JKKDKqfbgjtvk",
            authDomain: "drum-8d969.firebaseapp.com",
            projectId: "drum-8d969",
            storageBucket: "drum-8d969.appspot.com",
            messagingSenderId: "305532210099",
            appId: "1:305532210099:web:7bdffc74bb1c6d4b987d76",
            measurementId: "G-F3XLHXB5BM"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const appId = "main";
        const ADMIN_EMAIL = "admin@drumming.group";

        // ── Utilities ──
        const formatDateKey = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const getWeekDays = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const start = new Date(d.setDate(diff));
            return Array.from({length:7}, (_,i) => { const dd = new Date(start); dd.setDate(start.getDate()+i); return dd; });
        };

        // ... [Include all component code from original, skipping Firebase setup] ...
        // This is a placeholder - in production, copy all component definitions from the original file

        const Icon = ({ name, size = 24, style = {}, className = '' }) => {
            const icons = {
                ChevronLeft: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"></polyline></svg>,
                ChevronRight: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"></polyline></svg>,
                X: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
                Smile: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>,
            };
            return <span className={className} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:size,height:size,...style}}>{icons[name]}</span>;
        };

        // ───────────────────────────────────────────────────────────────────────
        // NEW: Unified Calendar Component
        // 特點：
        // 1. 移除「修煉記錄」「本月活動」的分頁切換
        // 2. 同時展示活動框色（平日藍/假日紅）+ 打卡笑臉（在數字下方）
        // 3. 下方 Detail Panel 顯示該日的活動和打卡信息
        // ───────────────────────────────────────────────────────────────────────
        const UnifiedCalendarView = ({ dailyLogs, activities, activitiesLoaded }) => {
            const [viewDate, setViewDate] = useState(new Date());
            const [selectedDateKey, setSelectedDateKey] = useState(null);

            const monthData = useMemo(() => {
                const year = viewDate.getFullYear();
                const month = viewDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const grid = [];
                for (let i = 0; i < firstDay; i++) grid.push(null);
                for (let d = 1; d <= daysInMonth; d++) grid.push(new Date(year, month, d));
                return grid;
            }, [viewDate]);

            // 獲取指定月份的活動
            const monthActivities = useMemo(() => {
                const year = viewDate.getFullYear();
                const month = String(viewDate.getMonth() + 1).padStart(2, '0');
                return activities.filter(a => a.date && a.date.substring(0, 7) === `${year}-${month}`);
            }, [activities, viewDate]);

            const prevMonth = () => {
                setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1));
                setSelectedDateKey(null);
            };

            const nextMonth = () => {
                setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1));
                setSelectedDateKey(null);
            };

            // 取得某日的活動和打卡信息
            const getDateInfo = (dateStr) => {
                const log = dailyLogs[dateStr] || {};
                const dayActivities = activities.filter(a => a.date === dateStr);
                const hasCheckin = log.practice > 0 || log.fiveMin > 0 || log.exerciseTime > 0 || log.stretchTime > 0;
                return { log, dayActivities, hasCheckin };
            };

            return (
                <div className="space-y-4 animate-in fade-in duration-300">
                    {/* 月份導航 */}
                    <div className="bg-white p-5 r-card card-shadow">
                        <div className="flex justify-between items-center mb-4">
                            <button onClick={prevMonth} className="w-8 h-8 bg-slate-50 r-btn flex items-center justify-center active-press" style={{border:'1px solid var(--c-border)'}}><Icon name="ChevronLeft" size={16} /></button>
                            <h2 className="sans-font" style={{color:'var(--c-text)', fontSize:'16px', fontWeight:'700'}}>{viewDate.getFullYear()} / {String(viewDate.getMonth() + 1).padStart(2, '0')}</h2>
                            <button onClick={nextMonth} className="w-8 h-8 bg-slate-50 r-btn flex items-center justify-center active-press" style={{border:'1px solid var(--c-border)'}}><Icon name="ChevronRight" size={16} /></button>
                        </div>

                        {/* 月曆格 - 統一樣式 */}
                        <div className="grid grid-cols-7 gap-1.5">
                            {/* 週日期標頭 */}
                            {['日','一','二','三','四','五','六'].map((w, wi) => (
                                <div key={w} className="text-center sans-font text-xs p-1" style={{color: wi===0||wi===6 ? 'var(--c-danger)' : 'var(--c-muted)', fontWeight: wi===0||wi===6 ? '700' : '500'}}>
                                    {w}
                                </div>
                            ))}

                            {/* 日期單元格 */}
                            {monthData.map((date, i) => {
                                if (!date) return <div key={i} className="aspect-square"></div>;

                                const dateStr = formatDateKey(date);
                                const { log, dayActivities, hasCheckin } = getDateInfo(dateStr);
                                const isToday = dateStr === formatDateKey(new Date());
                                const isSelected = selectedDateKey === dateStr;
                                const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                                
                                // 樣式邏輯：
                                // 有活動 → 平日藍框、假日紅框
                                // 有打卡 → 下方顯示笑臉
                                const hasActivity = dayActivities.length > 0;
                                const borderColor = hasActivity ? (isWeekend ? 'var(--c-danger)' : 'var(--c-primary)') : 'var(--c-border)';
                                const bgColor = hasActivity ? (isWeekend ? 'var(--c-danger-bg)' : 'var(--c-primary-bg)') : (isToday ? 'rgba(116, 192, 252, 0.1)' : 'white');

                                return (
                                    <button key={i}
                                        onClick={() => setSelectedDateKey(isSelected ? null : dateStr)}
                                        className="aspect-square flex flex-col items-center justify-center r-badge relative transition-all"
                                        style={{
                                            background: bgColor,
                                            border: `1px solid ${borderColor}`,
                                            cursor: 'pointer',
                                            opacity: hasActivity || hasCheckin || isToday ? 1 : 0.5,
                                        }}>
                                        {/* 日期數字 */}
                                        <span className="sans-font text-xs" style={{color:'var(--c-text)', fontWeight:'700'}}>
                                            {date.getDate()}
                                        </span>
                                        
                                        {/* 打卡笑臉圖標 - 使用 SVG Smile icon */}
                                        {hasCheckin && (
                                            <Icon name="Smile" size={14} style={{color:'var(--c-accent-text)', marginTop:'2px'}} />
                                        )}
                                    </button>
                                );
                            })}
                        </div>

                        {/* 圖例 */}
                        <div style={{display:'flex', gap:'16px', alignItems:'center', paddingTop:'12px', marginTop:'12px', borderTop:'1px solid var(--c-border)'}}>
                            <div style={{display:'flex', alignItems:'center', gap:'6px'}}>
                                <div style={{width:'14px', height:'14px', borderRadius:'3px', background:'var(--c-primary-bg)', border:'1.5px solid var(--c-primary)'}} />
                                <span className="sans-font" style={{fontSize:'10px', color:'var(--c-muted)'}}>活動</span>
                            </div>
                            <div style={{display:'flex', alignItems:'center', gap:'6px'}}>
                                <span style={{fontSize:'12px'}}>😊</span>
                                <span className="sans-font" style={{fontSize:'10px', color:'var(--c-muted)'}}>打卡</span>
                            </div>
                        </div>
                    </div>

                    {/* Detail Panel - 選中日期的詳情 */}
                    {selectedDateKey && (() => {
                        const { log, dayActivities } = getDateInfo(selectedDateKey);
                        const date = new Date(selectedDateKey);
                        const isWeekend = date.getDay() === 0 || date.getDay() === 6;

                        return (
                            <div className="bg-white p-5 r-card card-shadow space-y-3">
                                <div className="flex items-center justify-between pb-3" style={{borderBottom:'1px solid var(--c-border)'}}>
                                    <div>
                                        <span className="sans-font text-lg" style={{color:'var(--c-text)'}}>{selectedDateKey}</span>
                                        <span className="sans-font text-xs ml-2" style={{color:'var(--c-muted)'}}>{['日','一','二','三','四','五','六'][date.getDay()]}</span>
                                    </div>
                                    <button onClick={() => setSelectedDateKey(null)} style={{color:'var(--c-muted)',cursor:'pointer'}}><Icon name="X" size={16} /></button>
                                </div>

                                {/* 活動信息 */}
                                {dayActivities.length > 0 ? (
                                    <div className="space-y-2">
                                        <p className="sans-font text-xs" style={{color:'var(--c-text)', fontWeight:'600'}}>有 {dayActivities.length} 場活動</p>
                                        {dayActivities.map((act, ai) => (
                                            <div key={ai} className="p-2.5 r-btn" style={{background: isWeekend ? 'var(--c-danger-bg)' : 'var(--c-primary-bg)', border: `1px solid ${isWeekend ? 'var(--c-danger)' : 'var(--c-primary)'}`}}>
                                                <p className="sans-font text-xs" style={{color:'var(--c-text)', fontWeight:'600'}}>{act.name}</p>
                                                {act.time && <p className="text-[10px]" style={{color:'var(--c-muted)'}}>{act.time}</p>}
                                                {act.location && <p className="text-[10px]" style={{color:'var(--c-muted)'}}>{act.location}</p>}
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <p className="text-xs" style={{color:'var(--c-muted)'}}>此日無活動</p>
                                )}

                                {/* 打卡記錄 */}
                                {(log.practice > 0 || log.fiveMin > 0 || log.exerciseTime > 0 || log.stretchTime > 0) ? (
                                    <div className="pt-2 space-y-1" style={{borderTop:'1px solid var(--c-border)'}}>
                                        <p className="sans-font text-xs" style={{color:'var(--c-text)', fontWeight:'600'}}>打卡記錄</p>
                                        {log.practice > 0 && <p className="text-[10px]" style={{color:'var(--c-accent-text)'}}>🟨 練功 {log.practice} 次</p>}
                                        {log.fiveMin > 0 && <p className="text-[10px]" style={{color:'var(--c-primary-text)'}}>🟦 五分鐘 {log.fiveMin} 次</p>}
                                        {log.exerciseTime > 0 && <p className="text-[10px]" style={{color:'var(--c-danger-text)'}}>🟥 運動 {log.exerciseTime} 分</p>}
                                        {log.stretchTime > 0 && <p className="text-[10px]" style={{color:'var(--c-success)'}}>🟩 拉筋 {log.stretchTime} 分</p>}
                                    </div>
                                ) : (
                                    <p className="text-xs" style={{color:'var(--c-muted)'}}>此日未打卡</p>
                                )}
                            </div>
                        );
                    })()}
                </div>
            );
        };

        // ────────────────────────────────────────────────────────
        // 簡化的 App 結構（只呈現新的統一月曆）
        // ────────────────────────────────────────────────────────
        const App = () => {
            const [authReady, setAuthReady] = useState(false);
            const [user, setUser] = useState(null);
            const [dailyLogs, setDailyLogs] = useState({});
            const [globalActivities, setGlobalActivities] = useState([]);
            const [activitiesLoaded, setActivitiesLoaded] = useState(false);

            // Auth state listener
            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    setUser(u);
                    setAuthReady(true);
                });
                return () => unsub();
            }, []);

            // Load activities globally
            useEffect(() => {
                const unsub = db.collection('artifacts').doc(appId).collection('activities')
                    .onSnapshot(snap => {
                        const acts = [];
                        snap.forEach(doc => acts.push(doc.data()));
                        setGlobalActivities(acts);
                        setActivitiesLoaded(true);
                    });
                return () => unsub();
            }, []);

            // Load daily logs
            useEffect(() => {
                if (!user) return;
                const unsub = db.collection('artifacts').doc(appId).collection('users').doc(user.uid)
                    .collection('dailyLogs').onSnapshot(snap => {
                        const logs = {};
                        snap.forEach(doc => logs[doc.id] = doc.data());
                        setDailyLogs(logs);
                    });
                return () => unsub();
            }, [user]);

            if (!authReady) return <div className="flex items-center justify-center min-h-screen"><p className="text-xs" style={{color:'var(--c-muted)'}}>載入中...</p></div>;
            if (!user) return <div className="flex items-center justify-center min-h-screen"><p className="text-sm sans-font">請登入</p></div>;

            return (
                <div className="max-w-md mx-auto min-h-screen relative flex flex-col">
                    <header className="bg-white sticky top-0 px-5 py-4 flex justify-center z-30 relative" style={{borderBottom:'1px solid var(--c-border)'}}>
                        <div className="flex items-center space-x-3 justify-center">
                            <div className="w-2 h-2 rounded-full pk-blue"></div>
                            <span className="sans-font text-xl tracking-tighter" style={{color:'var(--c-text)'}}>自律動起來</span>
                            <div className="w-2 h-2 rounded-full pk-blue"></div>
                        </div>
                    </header>

                    <main className="flex-1 space-y-4" style={{padding:'var(--sp-page)'}}>
                        <UnifiedCalendarView dailyLogs={dailyLogs} activities={globalActivities} activitiesLoaded={activitiesLoaded} />
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
